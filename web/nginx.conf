# Nginx Configuration: Hybrid Cache-First Architecture for Football Data Lab Mini App
#
# Схема работы (Cache-First):
# 1. Nginx напрямую отдает статические файлы (HTML, CSS, JS, изображения, предсгенерированные JSON туров)
# 2. Если запрашиваемый файл тура отсутствует на диске (On-Demand архив) -> fallback в Go REST API
# 3. Запросы реального времени (/api/live, /api/fixtures/.../live) -> проксируются в Go REST API

server {
    listen 80;
    server_name _;

    root /home/user/GolandProjects/apisportmonks/web/viewer;
    index index.html;

    # Gzip сжатие для быстродействия в мобильных сетях Telegram
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Заголовки безопасности и CORS для Telegram Web App
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    # 1. Раздача статики Mini App (HTML, CSS, JS)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Предсгенерированные JSON туров (Cache-First)
    # Если файл data/8_28083_407868.json существует — отдает Nginx с диска мгновенно (0 ms).
    # Если архивного файла нет — перенаправляет в Go REST API для On-Demand сборки.
    location /data/ {
        try_files $uri @go_api_round;
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Fallback извлечение roundId из паттерна data/{league}_{season}_{round}.json
    location @go_api_round {
        rewrite ^/data/\d+_\d+_(\d+)\.json$ /api/rounds/$1 break;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Live Polling и REST API эндпоинты (Go API Server)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        # Отключаем буферизацию для мгновенной отдачи live-данных
        proxy_buffering off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 4. Проверка здоровья сервиса
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }
}
